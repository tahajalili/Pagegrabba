[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pagegrab"
version = "0.1.0"
description = "Capture a screen region page by page and merge the shots into a searchable (OCR) PDF."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taha J" }]
requires-python = ">=3.9"
dependencies = ["Pillow", "img2pdf"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.scripts]
pagegrab = "pagegrab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
